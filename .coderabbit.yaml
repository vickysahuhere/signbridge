# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!public/models/**"
    - "!public/mediapipe/**"
    - "!public/onnx/**"
    - "!dist/**"
  instructions: |
    You are reviewing code for SignBridge ISL (संकेत).
    Strictly enforce the 8 Golden Invariants from AGENTS.md:
    1. Zero Backend Servers: Client-side edge execution only; no server-side LLMs or Node/Python backend APIs for core recognition or translation.
    2. Off-Main-Thread AI: MediaPipe and ONNX Web runtime must remain strictly in `src/workers/vision.worker.js`.
    3. Normalization Contract: Feature arrays must strictly maintain Float32Array(240); never allow NaN or undefined coordinates.
    4. Temporal Motion Gating: Respect the 30-frame window and 1.2s auto-commit pause state machine.
    5. Confirmation Hysteresis: Ensure multi-frame hysteresis confirmation gates are respected.
    6. Deterministic Linguistics: Preserve deterministic ISL SOV-to-SVO grammar rules and fingerspelling concatenation.
    7. Dual-Transport Networking: Maintain WebRTC DataChannel + Supabase Broadcast + BroadcastChannel fallback.
    8. Retro '95 Aesthetic: Maintain 0px border-radius and authentic Windows 95 beveled UI styling; never introduce modern rounded borders.

chat:
  auto_reply: true
